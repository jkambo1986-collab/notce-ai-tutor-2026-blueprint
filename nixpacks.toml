[phases.setup]
nixPkgs = ["python312", "postgresql", "nodejs_20"]

[phases.install]
# pip lives in a venv: plain nix python312 has no pip on Dokploy's Nixpacks (exit 127).
paths = ["/opt/venv/bin"]
cmds = [
  "npm ci",
  "python -m venv /opt/venv && /opt/venv/bin/pip install -r backend/requirements.txt",
]

[phases.build]
cmds = [
  "npm run build",
  "cd backend && python manage.py collectstatic --noinput",
]

[start]
cmd = "cd backend 2>/dev/null; python manage.py migrate --noinput; python manage.py import_bank core/data/bank_seed.json || true; gunicorn config.wsgi --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120"
