[phases.setup]
nixPkgs = ["python312", "postgresql", "nodejs_20"]

[phases.install]
cmds = [
  "npm ci",
  "cd backend && pip install -r requirements.txt",
]

[phases.build]
cmds = [
  "npm run build",
  "cd backend && python manage.py collectstatic --noinput",
]

[start]
cmd = "cd backend && python manage.py migrate --noinput; python manage.py import_bank core/data/bank_seed.json || true; gunicorn config.wsgi --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120"
