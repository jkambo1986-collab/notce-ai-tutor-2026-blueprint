<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0D9488">
    <title>NOTCE AI-Tutor | Master the 2026 Blueprint</title>
    <meta name="description" content="The ultimate AI-powered study companion for the NOTCE exam. Master the Legacy Blueprint and prepare for the 2026 changes with our guarantee-backed simulations.">
    <script src="https://cdn.tailwindcss.com"></script>
    <!--
      Design system — "Clinical Trust": a calm, credible palette for a medical
      licensing-exam product. Tokens, soft layered shadows, and real keyframes are
      declared here because the app uses the Tailwind Play CDN (no build-time config).
    -->
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              canvas: '#FAFAF7',       // warm-white app background
              ink: '#0F172A',          // slate-900 primary text
              brand: {                 // teal — primary brand
                50:'#f0fdfa',100:'#ccfbf1',200:'#99f6e4',300:'#5eead4',400:'#2dd4bf',
                500:'#14b8a6',600:'#0d9488',700:'#0f766e',800:'#115e59',900:'#134e4a',
                DEFAULT:'#0d9488',
              },
            },
            fontFamily: {
              sans: ['Inter','system-ui','-apple-system','Segoe UI','sans-serif'],
              mono: ['JetBrains Mono','ui-monospace','monospace'],
            },
            boxShadow: {
              // Soft, layered shadows — credible and quiet, never harsh.
              soft: '0 1px 2px rgba(15,23,42,.04), 0 4px 12px rgba(15,23,42,.05)',
              'soft-lg': '0 4px 14px rgba(15,23,42,.06), 0 12px 36px rgba(15,23,42,.08)',
              card: '0 1px 3px rgba(15,23,42,.04), 0 10px 30px -10px rgba(15,23,42,.12)',
              'card-hover': '0 10px 28px -8px rgba(13,148,136,.22), 0 22px 56px -16px rgba(15,23,42,.16)',
              'glow-teal': '0 0 0 1px rgba(13,148,136,.10), 0 10px 34px -6px rgba(13,148,136,.40)',
              'inner-soft': 'inset 0 1px 2px rgba(15,23,42,.05)',
            },
            borderRadius: { '4xl': '2rem', '5xl': '2.5rem' },
            keyframes: {
              'fade-in': { '0%': { opacity: '0' }, '100%': { opacity: '1' } },
              'fade-in-up': { '0%': { opacity: '0', transform: 'translateY(14px)' }, '100%': { opacity: '1', transform: 'translateY(0)' } },
              'fade-in-down': { '0%': { opacity: '0', transform: 'translateY(-14px)' }, '100%': { opacity: '1', transform: 'translateY(0)' } },
              'scale-in': { '0%': { opacity: '0', transform: 'scale(.96)' }, '100%': { opacity: '1', transform: 'scale(1)' } },
              shimmer: { '100%': { transform: 'translateX(100%)' } },
              float: { '0%,100%': { transform: 'translateY(0)' }, '50%': { transform: 'translateY(-7px)' } },
              'pulse-soft': { '0%,100%': { opacity: '1' }, '50%': { opacity: '.55' } },
              'spin-slow': { '100%': { transform: 'rotate(360deg)' } },
            },
            animation: {
              'fade-in': 'fade-in .4s ease-out both',
              'fade-in-up': 'fade-in-up .55s cubic-bezier(.16,1,.3,1) both',
              'fade-in-down': 'fade-in-down .5s cubic-bezier(.16,1,.3,1) both',
              'scale-in': 'scale-in .35s cubic-bezier(.16,1,.3,1) both',
              shimmer: 'shimmer 1.6s infinite',
              float: 'float 5s ease-in-out infinite',
              'pulse-soft': 'pulse-soft 2.4s ease-in-out infinite',
              'spin-slow': 'spin-slow 1.1s linear infinite',
            },
          },
        },
      };
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono&display=swap"
      rel="stylesheet"
    >
    <link rel="icon" type="image/png" href="/favicon.png?v=2">
    <link rel="apple-touch-icon" href="/favicon.png">
    <link rel="shortcut icon" href="/favicon.png?v=2">
    <style>
      html { scroll-behavior: smooth; }
      body {
        font-family: "Inter", system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
        background-color: #FAFAF7;
      }
      /* Tighter tracking on large headings reads more confident/editorial. */
      h1, h2, h3 { letter-spacing: -0.018em; }

      /* On-brand text selection. */
      ::selection { background: #99f6e4; color: #0f172a; }

      /* Quiet, modern scrollbars. */
      * { scrollbar-width: thin; scrollbar-color: #cbd5e1 transparent; }
      *::-webkit-scrollbar { width: 10px; height: 10px; }
      *::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 9999px; border: 3px solid transparent; background-clip: content-box; }
      *::-webkit-scrollbar-thumb:hover { background: #94a3b8; background-clip: content-box; }

      /*
        Minimal re-implementation of tailwindcss-animate's enter utilities so the
        app's existing `animate-in / fade-in / slide-in-from-* / zoom-in-*` classes
        actually animate under the Play CDN (which omits that plugin).
      */
      @keyframes tw-enter {
        from {
          opacity: var(--tw-enter-opacity, 1);
          transform: translate3d(var(--tw-enter-translate-x, 0), var(--tw-enter-translate-y, 0), 0)
                     scale(var(--tw-enter-scale, 1));
        }
      }
      .animate-in { animation: tw-enter .35s cubic-bezier(.16,1,.3,1) both; }
      .fade-in, .fade-in-0 { --tw-enter-opacity: 0; }
      .zoom-in-95 { --tw-enter-scale: .95; }
      .zoom-in-90 { --tw-enter-scale: .90; }
      .slide-in-from-bottom-2 { --tw-enter-translate-y: .5rem; }
      .slide-in-from-bottom-4 { --tw-enter-translate-y: 1rem; }
      .slide-in-from-bottom-8 { --tw-enter-translate-y: 2rem; }
      .slide-in-from-top-2 { --tw-enter-translate-y: -.5rem; }
      .slide-in-from-top-4 { --tw-enter-translate-y: -1rem; }
      .slide-in-from-left { --tw-enter-translate-x: -100%; }
      .slide-in-from-left-4 { --tw-enter-translate-x: -1rem; }
      .slide-in-from-right { --tw-enter-translate-x: 100%; }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; scroll-behavior: auto !important; }
      }

      /* Vignette highlighting (Evidence-Link). */
      .vignette-highlight {
        background: linear-gradient(180deg, transparent 55%, #fde68a 55%);
        border-radius: 2px;
        cursor: pointer;
        transition: background .15s ease;
      }
      .vignette-highlight:hover { background: linear-gradient(180deg, transparent 0%, #fcd34d 0%); }
      .expert-highlight {
        background: linear-gradient(180deg, transparent 55%, #c7d2fe 55%);
        border-radius: 2px;
        border-bottom: 2px solid #6366f1;
        cursor: help;
      }
      .expert-highlight.critical {
        background: linear-gradient(180deg, transparent 55%, #a5b4fc 55%);
        border-bottom: 2px dashed #4f46e5;
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "recharts": "https://esm.sh/recharts@^3.6.0",
          "@google/genai": "https://esm.sh/@google/genai@^1.37.0",
          "react-router-dom": "https://esm.sh/react-router-dom@^7.18.0?external=react,react-dom",
          "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
          "react/": "https://esm.sh/react@^19.2.3/",
          "react": "https://esm.sh/react@^19.2.3"
        }
      }
    </script>

  </head>
  <body class="bg-canvas text-ink">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
